name: Android CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use Gradle 8.7
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle-8.7-bin.zip
          unzip gradle-8.7-bin.zip
          export PATH=$PWD/gradle-8.7/bin:$PATH
          chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --warning-mode all
